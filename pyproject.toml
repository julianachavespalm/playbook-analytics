[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playbook-analytics"
version = "0.1.0"
description = "Plataforma de inteligência analítica, engenharia de features e modelagem preditiva para telemetria de basquete."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Juliana Chaves Palm", email = "julianachavespalm@users.noreply.github.com" }
]
keywords = ["analytics", "basketball", "feature-store", "machine-learning", "statistics", "data-science", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "duckdb>=0.9.0",
    "pydantic>=2.0.0",
    "pyarrow>=14.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-v --cov=src/playbook --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"
